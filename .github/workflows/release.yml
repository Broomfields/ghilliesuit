name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: run tests
        run: ./gradlew build runGameTest
      - name: read release version
        id: release_version
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          minecraft_version=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$minecraft_version" >> "$GITHUB_OUTPUT"
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          MINECRAFT_VERSION: ${{ steps.release_version.outputs.minecraft_version }}
        run: |
          version="${{ steps.release_version.outputs.version }}"
          gh release create "v$version+$MINECRAFT_VERSION" "build/libs/ghillie-suit-mod-$version+$MINECRAFT_VERSION.jar" \
            --target "$RELEASE_COMMIT" \
            --title "Ghillie Suit v$version ($MINECRAFT_VERSION)" \
            --generate-notes
